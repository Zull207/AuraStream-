<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bg-grad)" stroke="#333" stroke-width="2"/>
  
  <!-- Crown -->
  <g transform="translate(135, 55)">
    <path d="M65 80 L25 10 L45 40 L65 0 L85 40 L105 10 L65 80Z" 
          fill="#111" stroke="#888" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Crown tips -->
    <circle cx="25" cy="8" r="4" fill="#888"/>
    <circle cx="65" cy="-2" r="4" fill="#888"/>
    <circle cx="105" cy="8" r="4" fill="#888"/>
  </g>
  
  <!-- Speed lines left -->
  <g opacity="0.7">
    <line x1="40" y1="160" x2="120" y2="160" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="180" x2="115" y2="178" stroke="#444" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="200" x2="118" y2="195" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Ink splash behind letters -->
  <g opacity="0.3">
    <circle cx="160" cy="200" r="35" fill="#111"/>
    <circle cx="200" cy="190" r="25" fill="#111"/>
    <circle cx="240" cy="210" r="30" fill="#111"/>
  </g>
  
  <!-- Letter A -->
  <text x="120" y="275" font-family="'Arial Black', 'Impact', sans-serif" font-size="160" font-weight="900" 
        fill="#d0d0d0" stroke="#111" stroke-width="8" stroke-linejoin="round" letter-spacing="-8">A</text>
  
  <!-- Letter S -->
  <text x="220" y="275" font-family="'Arial Black', 'Impact', sans-serif" font-size="160" font-weight="900" 
        fill="#d0d0d0" stroke="#111" stroke-width="8" stroke-linejoin="round" letter-spacing="-8">S</text>
  
  <!-- MUSIC text -->
  <text x="200" y="310" font-family="'Arial Black', 'Impact', sans-serif" font-size="36" font-weight="900" 
        fill="#444" text-anchor="middle" letter-spacing="8">MUSIC</text>
  
  <!-- Splatter dots -->
  <g opacity="0.4">
    <circle cx="95" cy="280" r="3" fill="#333"/>
    <circle cx="80" cy="250" r="2" fill="#333"/>
    <circle cx="310" cy="290" r="3" fill="#333"/>
    <circle cx="320" cy="260" r="2" fill="#333"/>
    <circle cx="100" cy="300" r="2" fill="#333"/>
    <circle cx="300" cy="310" r="2.5" fill="#333"/>
    <circle cx="85" cy="220" r="1.5" fill="#333"/>
    <circle cx="330" cy="230" r="1.5" fill="#333"/>
    <circle cx="150" cy="320" r="2" fill="#333"/>
    <circle cx="260" cy="320" r="2" fill="#333"/>
  </g>
</svg>